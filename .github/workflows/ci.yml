name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Compile check
        run: python -m compileall -q src tests examples
      - name: Run unit tests
        run: pytest tests/ -v
      - name: Verify clean workspace gate
        run: mcp-ward scan examples/clean_workspace --fail-on LOW
      - name: Run adversarial benchmark
        run: mcp-ward eval
