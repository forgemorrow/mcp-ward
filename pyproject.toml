[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-ward"
version = "0.1.0"
description = "Static security auditor, toxic-flow capability analyzer, adversarial benchmark, and runtime stdio guardrail proxy for MCP Servers and Agent Skills."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "forgemorrow", email = "2245265937@qq.com"},
]
keywords = ["mcp", "ai-agents", "security", "guardrails", "static-analysis", "red-team"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[project.scripts]
mcp-ward = "mcp_ward.cli:main"

[project.urls]
Homepage = "https://github.com/forgemorrow/mcp-ward"
Repository = "https://github.com/forgemorrow/mcp-ward"
Issues = "https://github.com/forgemorrow/mcp-ward/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
